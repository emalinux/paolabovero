<header class="site-header">
  <div class="container header-inner">
    
    <div class="site-identity">
      <h1 class="site-title">
        <a href="/">
          <img src="/img/logg.png" alt="Paola Bovero">
          <span>Paola Bovero</span>
        </a>
      </h1>
    </div>

    <button class="hamburger" aria-label="Apri menu" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="main-nav" id="main-nav">
      <ul>
        {{ range .Site.Menus.main }}
          <li class="{{ if .HasChildren }}has-dropdown{{ end }}">
            <a href="{{ .URL }}">{{ .Name }}</a>

            {{ if .HasChildren }}
              <ul class="dropdown">
                {{ range .Children }}
                  <li>
                    <a href="{{ .URL }}">{{ .Name }}</a>
                  </li>
                {{ end }}
              </ul>
            {{ end }}

          </li>
        {{ end }}
      </ul>
    </nav>

  </div>
</header>
